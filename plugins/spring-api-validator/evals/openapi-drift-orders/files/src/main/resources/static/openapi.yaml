openapi: 3.0.3
info:
  title: Orders API
  description: Published contract for the web shop and the mobile app. Client SDKs are generated from this file.
  version: "2.1"
servers:
  - url: https://shop.example.com/api
paths:
  /v1/orders:
    post:
      summary: Place an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid request
  /v1/orders/{orderId}:
    get:
      summary: Get an order
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: No order with that id
  /v1/orders/{orderId}/status:
    patch:
      summary: Change an order's status
      operationId: changeStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /v1/customers/{customerId}/orders:
    get:
      summary: List a customer's orders
      operationId: listCustomerOrders
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: The customer's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerId, items, shippingAddress]
      properties:
        customerId: {type: integer, format: int64}
        shippingAddress: {type: string, maxLength: 200}
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku: {type: string}
        quantity: {type: integer, minimum: 1}
    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PAID, SHIPPED, CANCELLED]
    OrderResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        orderNumber: {type: string}
        status: {type: string}
        itemCount: {type: string}
        shippingAddress: {type: string}
