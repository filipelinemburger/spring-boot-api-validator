name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Quick checker unit tests
        run: python3 -m unittest discover tests -v

      - name: Validate plugin and marketplace
        run: |
          npm install --global --silent @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate ./plugins/spring-api-validator --profile directory

      # The repository is also a GitHub Action: run it on an eval app and check what it reports.
      - name: Run the action on the order-service eval app
        id: action
        uses: ./
        with:
          path: evals/full-audit-order-service/files
          fail-on: never
          changed-only: "false"

      - name: Check the action's outputs
        env:
          ERRORS: ${{ steps.action.outputs.errors }}
        run: |
          echo "errors=$ERRORS"
          test "$ERRORS" = "7"

      - name: The action fails the job on errors when asked to
        id: failing
        continue-on-error: true
        uses: ./
        with:
          path: evals/full-audit-order-service/files
          fail-on: error
          changed-only: "false"

      - name: Check it failed
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: test "$OUTCOME" = "failure"

  # The Claude plugin directory accepts no bundled scripts from unverified organizations, so it
  # tracks the `directory` branch: the plugin without its scripts/, rebuilt from every push to main.
  directory-edition:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: directory-edition
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the directory branch (or start it)
        run: |
          if git ls-remote --exit-code --heads origin directory >/dev/null; then
            git worktree add -B directory "$RUNNER_TEMP/edition" origin/directory
          else
            git worktree add --detach "$RUNNER_TEMP/edition"
            git -C "$RUNNER_TEMP/edition" checkout -q --orphan directory
            git -C "$RUNNER_TEMP/edition" rm -rq --cached .
            find "$RUNNER_TEMP/edition" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Build the directory edition
        run: python3 tools/build_directory_edition.py --out "$RUNNER_TEMP/edition"

      - name: Validate it
        run: |
          npm install --global --silent @anthropic-ai/claude-code
          claude plugin validate "$RUNNER_TEMP/edition/plugins/spring-api-validator" --profile directory

      - name: Publish to the directory branch
        working-directory: ${{ runner.temp }}/edition
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Directory edition unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Directory edition of ${GITHUB_SHA::7}"
          git push origin directory
