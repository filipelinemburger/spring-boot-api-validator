# Spring API review by Claude — the full skill on every pull request, posted as review comments.
# Copy to .github/workflows/ in your Spring Boot repository.
#
# Setup:
#   1. Install the Claude GitHub App on the repository (in Claude Code: /install-github-app),
#      or follow https://code.claude.com/docs/en/github-actions.
#   2. Add an ANTHROPIC_API_KEY repository secret (or swap in claude_code_oauth_token).
#
# What it does: installs the spring-api-validator plugin from its marketplace, runs
# /spring-api-validator:validate-api on what the PR changes, posts each Error/Warning as an inline
# comment on the changed line and one summary comment. It reports only — it never approves, requests
# changes, pushes or edits code.
#
# Cost: one model review per run (roughly 100k tokens on a small change; more on large ones). The
# paths filter and the draft check below keep it to PRs that touch the API.
# Fork PRs: secrets aren't passed to workflows from forks, so the job is skipped for them.

name: Spring API review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/pom.xml"
      - "**/build.gradle*"
      - "**/application*.yml"
      - "**/application*.yaml"
      - "**/application*.properties"
      - ".api-validator.md"

concurrency:
  group: spring-api-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # summary comment via gh
      issues: read
      id-token: write      # required by the Claude GitHub App authentication
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the review compares the PR with its base branch

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/filipelinemburger/spring-boot-api-validator.git
          plugins: spring-api-validator@spring-tools
          prompt: >-
            /spring-api-validator:validate-api
            --diff origin/${{ github.base_ref }}
            --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Write,Bash(git:*),Bash(python3:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
