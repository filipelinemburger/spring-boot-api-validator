spring:
  application:
    name: recipes
  datasource:
    url: jdbc:h2:file:./data/recipes
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/realms/recipes
